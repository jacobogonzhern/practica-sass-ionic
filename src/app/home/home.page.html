<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Práctica Sass</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Título: el texto se escribe normal; las mayúsculas las pone el CSS -->
  <h1 class="home__titulo">Mi primera app con Sass</h1>

  <!-- Contenedor flex para poder mandar el botón a la derecha -->
  <div class="home__acciones">
    <ion-button class="home__boton">Pulsar</ion-button>
  </div>

  <!-- Imagen centrada con borde verde -->
  <img class="home__imagen" src="assets/img/foto.jpg" alt="Imagen de ejemplo de la práctica" />
</ion-content>
